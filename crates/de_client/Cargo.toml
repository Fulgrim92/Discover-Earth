[package]
name = "de_client"
description = "Discover Earth's 3D client on Bevy: terrain, sky, sea, fly camera, headless captures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
de_world.workspace = true
serde_json.workspace = true
bevy = { workspace = true, features = [
  "3d_bevy_render",
  "default_app",
  "std",
  "multi_threaded",
  "bevy_winit",
  "x11",
  "bevy_remote",
  "bevy_gilrs",
  "bevy_ui",
  "bevy_ui_render",
  "default_font",
  "jpeg",
  # Film-look rendering (look.cinema): tonemapping LUTs (TonyMcMapface and AgX need them; without
  # them Bevy falls back to an identity LUT), blue noise for the atmosphere and volumetrics.
  "tonemapping_luts",
  "bluenoise_texture",
  "ktx2",
  "zstd_rust",
] }

[[bin]]
name = "discover-earth"
path = "src/bin/game.rs"

[[bin]]
name = "de-shot"
path = "src/bin/shot.rs"

[lints]
workspace = true
