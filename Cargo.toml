# Discover Earth: a dreamlike island explorer, with Bevy drawing in 3D.
#
# Layers (see docs/ARCHITECTURE.md):
#   world  crates/de_world   island data: terrain, schemas, sampling; no renderer, no window
#   game   crates/de_client  the Bevy 3D client: terrain mesh, sky, water, camera, captures
#   tool   crates/de_cli     the `de` command line for agents
[workspace]
resolver = "3"
members = ["crates/de_world", "crates/de_client", "crates/de_cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Pinned exactly: Bevy's minor releases break APIs.
bevy = { version = "=0.20.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order"] }
schemars = "1.2"
clap = { version = "4.6", features = ["derive"] }
png = "0.18"
nv-flip = "0.1.2"
zune-jpeg = "0.5"

de_world = { path = "crates/de_world" }
de_client = { path = "crates/de_client" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

# Bevy and the terrain build are slow unoptimised; our own crates stay quick to rebuild.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.package.de_world]
opt-level = 2
